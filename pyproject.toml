[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipecat-gmicloud"
version = "0.1.0"
description = "Pipecat text-to-speech service for GMI Cloud's multimodal inference engine (Inworld TTS, MiniMax TTS, Chatterbox and more)."
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Jayanng" }]
keywords = ["pipecat", "tts", "text-to-speech", "voice", "gmi-cloud", "inworld", "minimax"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "pipecat-ai>=0.0.86",
    "aiohttp>=3.9",
]

[project.urls]
Homepage = "https://github.com/Jayanng/pipecat-gmicloud"
Changelog = "https://github.com/Jayanng/pipecat-gmicloud/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
